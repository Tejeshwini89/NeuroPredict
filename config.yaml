dataset:
  file: realAWSCloudwatch/ec2_cpu_utilization_53ea38.csv
  train_ratio: 0.70
  validation_ratio: 0.15

model:
  sequence_length: 48
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.10
  batch_size: 64
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.00001

anomaly:
  threshold_quantile: 0.995
  persistence: 1
  max_validation_fpr: 0.02