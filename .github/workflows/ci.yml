name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: python scripts/download_data.py

      - name: Train model
        run: python -m src.neuropredict.train

      - name: Evaluate model
        run: python -m src.neuropredict.evaluate

      - name: Run tests
        run: pytest -q